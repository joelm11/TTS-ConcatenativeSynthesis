[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concatenative-synthesis"
version = "0.1.0"
description = "Diphone PSOLA concatenative speech synthesis"
requires-python = ">=3.9"
dependencies = [
    "librosa",
    "numpy",
    "pandas",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["."]