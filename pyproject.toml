[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "concatenative-synthesis"
version = "0.1.0"
description = "Diphone PSOLA concatenative speech synthesis"
requires-python = ">=3.9"
dependencies = [
    "librosa",
    "numpy",
    "pandas",
    "pyarrow",
]